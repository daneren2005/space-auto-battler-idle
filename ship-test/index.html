<!DOCTYPE html>
<html lang="">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
		<link rel="icon" href="/favicon.ico">
		<title>Space Auto Battler Idle - Ship Test</title>
		<style>
			/* The ship-test canvas is landscape (see WIDE_DISPLAY_* in src/game/display.ts) so the whole roster fits
			   on screen, but the page around it is the same: hand the canvas the whole viewport and let Scale.FIT
			   letterbox it.  This page is a developer tool, meant for a desktop screen. */
			body {
				margin: 0;
				background: #05070f;
				overflow: hidden;
			}

			/* Give Phaser's parent a determinate size.  With Scale.FIT and an auto-sized parent the canvas and its
			   container feed back into each other and the canvas grows every resize; a fixed box breaks that loop. */
			#phaser-container {
				width: 100vw;
				height: 100vh;
				height: 100dvh;
			}
		</style>
	</head>
	<body>
		<div id="phaser-container"></div>
		<script type="module" src="/src/ship-test.ts"></script>
	</body>
</html>
